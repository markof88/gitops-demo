{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "caralegal-service.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchExpressions:
        - key: job-name
          operator: In
          values:
          - {{ include "caralegal-service.name" . }}-db-bootstrap
          - {{ include "caralegal-service.name" . }}-migration
    ports:
    - protocol: TCP
      port: 5432
{{- end }}
