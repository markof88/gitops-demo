replicaCount: 2

image:
  repository: ghcr.io/markof88/gitops-demo/demo-app
  tag: ac97cc6044c1f8171aa06829455949d1865a3df7

service:
  type: LoadBalancer
  port: 80
  targetPort: 80

envFromSecrets:
  - envName: SECRET_MESSAGE
    secretName: demo-secret
    secretKey: message
  - envName: TEAM_MESSAGE
    secretName: demo-secret
    secretKey: team-message

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

probes:
  enabled: true
  path: /
  port: 80

pdb:
  enabled: true
  maxUnavailable: 1

postgres:
  enabled: true
  image: postgres:15-alpine
  database: demo
  user: demo
  secretName: postgres-secret

dbBootstrap:
  enabled: true
  image: postgres:15-alpine
  pgHost: postgres
  pgDatabase: demo
  appUsername: demo_app
  appPasswordSecretName: app-db-secret
  appPasswordSecretKey: password

migrations:
  enabled: true
  image: postgres:15-alpine
  pgHost: postgres
  pgDatabase: demo
  appSecretName: app-db-secret
  sql: |
    echo "001: create messages table..."
    psql -c "CREATE TABLE IF NOT EXISTS messages (
      id         SERIAL PRIMARY KEY,
      message    TEXT NOT NULL,
      created_at TIMESTAMP DEFAULT NOW()
    );"

    echo "002: add team_message column..."
    psql -c "ALTER TABLE messages ADD COLUMN IF NOT EXISTS team_message TEXT;"

    echo "003: seed initial data if empty..."
    psql -c "INSERT INTO messages (message, team_message)
      SELECT 'Hello from GitOps!', 'Deployed by ArgoCD'
      WHERE NOT EXISTS (SELECT 1 FROM messages LIMIT 1);"

    echo "004: add deployment_source column..."
    psql -c "ALTER TABLE messages ADD COLUMN IF NOT EXISTS deployment_source TEXT DEFAULT 'argocd';"

    echo "005: add demo_version column..."
    psql -c "ALTER TABLE messages ADD COLUMN IF NOT EXISTS demo_version TEXT DEFAULT 'v1';"

    echo "006: add presented_at column..."
    psql -c "ALTER TABLE messages ADD COLUMN IF NOT EXISTS presented_at TIMESTAMP DEFAULT NOW();"

# Raw Kubernetes objects managed by Helm (simple secrets only)
# SealedSecrets are in services/demo-app/secrets/ — applied as raw YAML, not through Helm
extraObjects:
  # dev only — plaintext. In prod this would be a SealedSecret.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: postgres-secret
      namespace: demo
    type: Opaque
    stringData:
      password: demo-password
